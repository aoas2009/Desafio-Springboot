<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/logo.png" width="200">
            </div>
            <div class="sidebar-button">
                
            </div>
        </aside>

        <div class="content">

            <header class="topbar">
                <button class="icon-btn" type="button" aria-label="Abrir menu">
                    <span class="placeholder-icon placeholder-icon--sm"></span>
                </button>

                <div class="topbar-title">
                    <h1>SISTEMA DE CONTRATO</h1>
                    <span>Painel de Funcionários</span>
                </div>

                <div class="topbar-actions">
                    <button class="icon-btn" type="button" aria-label="Tema">
                        <span class="placeholder-icon placeholder-icon--sm"></span>
                    </button>
                    <button class="icon-btn" type="button" aria-label="Tela cheia">
                        <span class="placeholder-icon placeholder-icon--sm"></span>
                    </button>

                    <div class="user-info">
                        <span class="user-name">Artur</span>
                        <span class="user-role">Admin</span>
                    </div>

                    <div class="user-avatar placeholder-icon"></div>
                </div>
            </header>

            <main class="main">

                <nav class="breadcrumb">
                    <span class="placeholder-icon placeholder-icon--sm"></span>
                    <span>/</span>
                    <span>Funcionários</span>
                </nav>

                <div class="toolbar">
                    <button class="btn btn-primary" type="button">
                        <span class="placeholder-icon placeholder-icon--sm"></span>
                        Adicionar
                    </button>

                    <div class="search-box">
                        <input type="text" placeholder="Buscar por nome">
                        <button class="search-btn" type="button" aria-label="Buscar">
                            <span class="placeholder-icon placeholder-icon--sm"></span>
                        </button>
                    </div>
                </div>

                <section class="employee-list">

                    <article class="employee-row">
                        <div class="employee-info">
                            <div class="employee-avatar placeholder-icon"></div>
                            <div class="employee-text">
                                <span class="employee-name">Artur Silva</span>
                                <span class="employee-role">Assistente de Desenvolvimento</span>
                            </div>
                        </div>
                        <div class="employee-actions">
                            <button class="btn btn-reject" type="button">RECUSAR</button>
                            <button class="btn btn-approve" type="button">APROVAR</button>
                            <button class="btn btn-edit" type="button">EDITAR</button>
                        </div>
                    </article>

                    <article class="employee-row">
                        <div class="employee-info">
                            <div class="employee-avatar placeholder-icon"></div>
                            <div class="employee-text">
                                <span class="employee-name">Davi Souza</span>
                                <span class="employee-role">Desenvolvedor Backend</span>
                            </div>
                        </div>
                        <div class="employee-actions">
                            <button class="btn btn-reject" type="button">RECUSAR</button>
                            <button class="btn btn-approve" type="button">APROVAR</button>
                            <button class="btn btn-edit" type="button">EDITAR</button>
                        </div>
                    </article>

                    <article class="employee-row">
                        <div class="employee-info">
                            <div class="employee-avatar placeholder-icon"></div>
                            <div class="employee-text">
                                <span class="employee-name">Maria Oliveira</span>
                                <span class="employee-role">Analista de QA</span>
                            </div>
                        </div>
                        <div class="employee-actions">
                            <button class="btn btn-reject" type="button">RECUSAR</button>
                            <button class="btn btn-approve" type="button">APROVAR</button>
                            <button class="btn btn-edit" type="button">EDITAR</button>
                        </div>
                    </article>

                    <article class="employee-row">
                        <div class="employee-info">
                            <div class="employee-avatar placeholder-icon"></div>
                            <div class="employee-text">
                                <span class="employee-name">João Pereira</span>
                                <span class="employee-role">Desenvolvedor Frontend</span>
                            </div>
                        </div>
                        <div class="employee-actions">
                            <button class="btn btn-reject" type="button">RECUSAR</button>
                            <button class="btn btn-approve" type="button">APROVAR</button>
                            <button class="btn btn-edit" type="button">EDITAR</button>
                        </div>
                    </article>

                </section>

            </main>
        </div>
    </div>
</body>
</html>
